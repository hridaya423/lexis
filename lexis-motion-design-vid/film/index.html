      #over { z-index: 5; } #demo { z-index: 6; } #key { z-index: 7; } #cur { z-index: 8; }

      .ln { position: absolute; left: 0; top: 0; height: 120px; width: 1920px; }
      .ch { position: absolute; left: 0; top: 0; font-size: 104px; line-height: 130px; color: #182510; white-space: pre; transform-origin: 0 0; }
      #key { position: absolute; left: 0; top: 0; width: 176px; height: 86px; perspective: 700px; display: none; }
